services:
  postgres:
    image: postgres:17-alpine
    container_name: triovexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: triovexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - triovexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triovexa"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - triovexa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  workload-supervisor:
    build: .
    restart: unless-stopped
    entrypoint: ["triovexa-workload", "supervisor"]
    environment:
      REDIS_ADDRESS: redis:6379
      CONTROL_PORT: "8091"
      CONTROL_API_TOKEN: ${WORKLOAD_CONTROL_TOKEN:-local-control-token}
    depends_on:
      redis:
        condition: service_healthy

  producer:
    build: .
    restart: unless-stopped
    entrypoint: ["triovexa-workload", "producer"]
    environment:
      REDIS_ADDRESS: redis:6379
      PRODUCER_INTERVAL: 1s
    depends_on:
      redis:
        condition: service_healthy

  triovexa:
    build: .
    restart: unless-stopped
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      HTTP_WRITE_TIMEOUT: 150s
      APP_ENV: local
      DEPLOYMENT_MODE: local-demo
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/triovexa?sslmode=disable
      DOCS_ROOT: /app/docs
      WORKLOAD_CONTROL_BASE_URL: http://workload-supervisor:8091
      WORKLOAD_CONTROL_TOKEN: ${WORKLOAD_CONTROL_TOKEN:-local-control-token}
      REDIS_ADDRESS: redis:6379
      PROMETHEUS_BASE_URL: http://prometheus:9090
      ALERTMANAGER_BASE_URL: http://alertmanager:9093
      LOKI_BASE_URL: http://loki:3100
      REASONING_MODE: heuristic
      OBSERVABILITY_MODE: demo
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      workload-supervisor:
        condition: service_started
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deployments/playground/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/playground/prometheus-alerts.yml:/etc/prometheus/rules/triovexa.yml:ro
    depends_on:
      - workload-supervisor
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deployments/playground/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./deployments/playground/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3300}:3000"
    volumes:
      - ./deployments/playground/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deployments/playground/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deployments/playground/dashboards:/var/lib/grafana/dashboards:ro
      - triovexa-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - alloy

volumes:
  triovexa-postgres-data:
  triovexa-redis-data:
  triovexa-grafana-data:
